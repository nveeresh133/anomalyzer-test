apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-ai-troubleshooter
  namespace: default
  labels:
    app.kubernetes.io/name: k8s-ai-troubleshooter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-ai-troubleshooter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-ai-troubleshooter
    spec:
      serviceAccountName: k8s-ai-troubleshooter-sa
      containers:
        - name: troubleshooter
          image: k8s-ai-troubleshooter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-credentials
                  key: api-key
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-ai-troubleshooter-svc
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: k8s-ai-troubleshooter

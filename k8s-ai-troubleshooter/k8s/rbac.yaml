apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-ai-troubleshooter-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-ai-troubleshooter-reader
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - services
      - endpoints
      - events
      - configmaps
      - persistentvolumeclaims
      - nodes
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-ai-troubleshooter-binding
subjects:
  - kind: ServiceAccount
    name: k8s-ai-troubleshooter-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: k8s-ai-troubleshooter-reader
  apiGroup: rbac.authorization.k8s.io
